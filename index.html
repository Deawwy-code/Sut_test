<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUT Tinder - สมัครสมาชิก</title>

<style>
*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  color:white;
  background:
    radial-gradient(circle at top,#5c2600 0%,#241000 45%,#0d0804 100%);
}

.box{
  width:100%;
  max-width:450px;
  background:#170a03;
  border:1px solid #71350e;
  border-radius:25px;
  padding:28px;
  box-shadow:0 20px 60px #000;
}

.logo{
  text-align:center;
  font-size:30px;
  font-weight:bold;
  color:#ff9638;
}

.sub{
  text-align:center;
  color:#aaa;
  margin:8px 0 25px;
}

label{
  display:block;
  color:#ffb46d;
  font-size:14px;
  margin-top:10px;
}

input,select{
  width:100%;
  padding:13px;
  margin-top:6px;
  margin-bottom:10px;
  background:#251006;
  color:white;
  border:1px solid #63300e;
  border-radius:10px;
  outline:none;
}

button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:0;
  border-radius:12px;
  background:#ff7a00;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#ff9638;
}

.link{
  text-align:center;
  margin-top:18px;
  color:#aaa;
}

a{
  color:#ff9638;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="box">

  <div class="logo">
    🧡 SUT Tinder
  </div>

  <div class="sub">
    สมัครสมาชิก
  </div>

  <label>ชื่อ</label>
  <input id="name" placeholder="ชื่อเล่น">

  <label>อายุ</label>
  <input id="age" type="number" min="15" max="100">

  <label>เพศ</label>
  <select id="gender">
    <option value="">เลือกเพศ</option>
    <option value="ชาย">ชาย</option>
    <option value="หญิง">หญิง</option>
  </select>

  <label>คณะ</label>
  <input id="faculty" placeholder="เช่น วิศวกรรมศาสตร์">

  <label>ชั้นปี</label>
  <select id="year">
    <option value="">เลือกชั้นปี</option>
    <option>ปี 1</option>
    <option>ปี 2</option>
    <option>ปี 3</option>
    <option>ปี 4</option>
    <option>ปี 5</option>
  </select>

  <label>อีเมล</label>
  <input id="email" type="email">

  <label>รหัสผ่าน</label>
  <input id="password" type="password">

  <button onclick="register()">
    สมัครสมาชิก 🧡
  </button>

  <div class="link">
    มีบัญชีแล้ว?
    <a href="login.html">เข้าสู่ระบบ</a>
  </div>

</div>

<script>

function register(){

  const name =
    document.getElementById("name").value.trim();

  const age =
    Number(document.getElementById("age").value);

  const gender =
    document.getElementById("gender").value;

  const faculty =
    document.getElementById("faculty").value.trim();

  const year =
    document.getElementById("year").value;

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;


  if(
    !name ||
    !age ||
    !gender ||
    !faculty ||
    !year ||
    !email ||
    !password
  ){

    alert("กรุณากรอกข้อมูลให้ครบ");

    return;
  }


  if(age < 15 || age > 100){

    alert("กรุณากรอกอายุให้ถูกต้อง");

    return;
  }


  let users =
    JSON.parse(
      localStorage.getItem("sutTinderUsers")
    ) || [];


  const exists =
    users.some(
      u =>
        u.email.toLowerCase() ===
        email.toLowerCase()
    );


  if(exists){

    alert("อีเมลนี้มีบัญชีอยู่แล้ว");

    return;
  }


  const user = {

    id:
      "user_" +
      Date.now(),

    name:name,

    age:age,

    gender:gender,

    faculty:faculty,

    year:year,

    email:email,

    password:password,

    bio:"",

    photo:"",

    likes:[],

    matches:[]

  };


  users.push(user);


  localStorage.setItem(
    "sutTinderUsers",
    JSON.stringify(users)
  );


  localStorage.setItem(
    "sutTinderUser",
    JSON.stringify(user)
  );


  alert("สมัครสมาชิกสำเร็จ 🧡");

  location.href="login.html";
}

</script>

</body>
</html>
