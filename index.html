<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SUT Tinder 💕</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ea6666, #a24b68);
    color: white;
}

/* =========================
   PAGE
========================= */

.page {
    min-height: 100vh;
    display: none;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.page.active {
    display: flex;
}

/* =========================
   CARD
========================= */

.card {
    width: 100%;
    max-width: 430px;
    padding: 35px 30px;
    text-align: center;

    background: rgba(255,255,255,.16);

    border-radius: 25px;

    box-shadow:
        0 20px 50px rgba(0,0,0,.25);

    backdrop-filter: blur(12px);
}

/* =========================
   LOGO
========================= */

.logo {
    font-size: 55px;
}

h1 {
    margin: 5px 0 10px;
    font-size: 40px;
}

.subtitle {
    font-size: 17px;
    margin-bottom: 25px;
}

/* =========================
   INPUT
========================= */

input,
select,
textarea {

    width: 100%;

    padding: 14px;

    margin: 7px 0;

    border: none;

    border-radius: 12px;

    outline: none;

    font-size: 16px;

    font-family: Arial, sans-serif;
}

textarea {
    height: 90px;
    resize: none;
}

/* =========================
   BUTTON
========================= */

.main-btn {

    width: 100%;

    padding: 15px;

    margin-top: 15px;

    border: none;

    border-radius: 999px;

    background: white;

    color: #c65379;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;

    transition: .2s;
}

.main-btn:hover {
    transform: scale(1.03);
}

/* =========================
   LINK
========================= */

.link {

    margin-top: 20px;

    font-size: 14px;
}

.link span {

    font-weight: bold;

    cursor: pointer;

    text-decoration: underline;
}

/* =========================
   PHOTO UPLOAD
========================= */

.photo-upload {

    width: 130px;
    height: 130px;

    margin: 0 auto 15px;

    border-radius: 50%;

    background: rgba(255,255,255,.8);

    border: 4px solid white;

    overflow: hidden;

    display: flex;

    align-items: center;
    justify-content: center;
}

.photo-upload img {

    width: 100%;
    height: 100%;

    object-fit: cover;

    display: none;
}

.photo-icon {
    font-size: 45px;
}

/* =========================
   HOME
========================= */

.home {

    min-height: 100vh;

    display: none;

    flex-direction: column;
}

.home.active {
    display: flex;
}

/* =========================
   NAVBAR
========================= */

header {

    height: 70px;

    padding: 0 20px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    background: rgba(255,255,255,.15);

    backdrop-filter: blur(10px);
}

.logo-small {

    font-size: 23px;

    font-weight: bold;
}

.logout {

    border: none;

    padding: 10px 18px;

    border-radius: 20px;

    background: white;

    color: #c65379;

    font-weight: bold;

    cursor: pointer;
}

/* =========================
   PROFILE
========================= */

.container {

    width: 100%;

    max-width: 450px;

    margin: 30px auto;

    padding: 0 15px;
}

.profile-card {

    overflow: hidden;

    background: white;

    color: #333;

    border-radius: 25px;

    box-shadow:
        0 15px 40px rgba(0,0,0,.3);
}

.profile-photo {

    height: 400px;

    background:
        linear-gradient(
            135deg,
            #ffd6df,
            #f6a9bd
        );

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;
}

.profile-photo img {

    width: 100%;
    height: 100%;

    object-fit: cover;

    display: none;
}

.default-photo {
    font-size: 110px;
}

.profile-info {
    padding: 22px;
}

.profile-name {

    font-size: 28px;

    font-weight: bold;
}

.profile-details {

    color: #777;

    margin-top: 6px;
}

.profile-bio {

    margin-top: 15px;

    color: #555;
}

/* =========================
   ACTIONS
========================= */

.actions {

    display: flex;

    justify-content: center;

    gap: 30px;

    padding: 20px;
}

.action {

    width: 65px;
    height: 65px;

    border: none;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 5px 15px #0003;

    font-size: 28px;

    cursor: pointer;

    transition: .2s;
}

.action:hover {
    transform: scale(1.1);
}

.dislike {
    color: #ff4d6d;
}

.like {
    color: #20c997;
}

/* =========================
   EMPTY
========================= */

.empty {

    display: none;

    text-align: center;

    padding: 50px 20px;
}

.empty h2 {
    font-size: 30px;
}

/* =========================
   MATCH
========================= */

.match {

    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.65);

    align-items: center;

    justify-content: center;

    padding: 20px;
}

.match-box {

    width: 100%;

    max-width: 350px;

    padding: 35px;

    background: white;

    color: #333;

    border-radius: 25px;

    text-align: center;
}

.match-heart {
    font-size: 70px;
}

.match-box h2 {
    color: #e75480;
}

.chat-btn {

    border: none;

    padding: 13px 25px;

    border-radius: 25px;

    background: #e75480;

    color: white;

    font-weight: bold;

    cursor: pointer;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width: 500px) {

    .card {
        padding: 30px 20px;
    }

    h1 {
        font-size: 34px;
    }

    .profile-photo {
        height: 360px;
    }

}

</style>
</head>

<body>


<!-- ==================================================
     REGISTER PAGE
================================================== -->

<section
    id="registerPage"
    class="page active">

    <div class="card">

        <div class="logo">
            💕
        </div>

        <h1>
            SUT Tinder
        </h1>

        <p class="subtitle">
            สร้างบัญชีใหม่
        </p>


        <!-- PHOTO -->

        <div class="photo-upload">

            <img
                id="previewPhoto"
                alt="รูปโปรไฟล์">

            <span
                id="photoIcon"
                class="photo-icon">
                📷
            </span>

        </div>


        <input
            type="file"
            id="photoInput"
            accept="image/*">


        <input
            type="text"
            id="registerName"
            placeholder="ชื่อของคุณ">


        <input
            type="email"
            id="registerEmail"
            placeholder="อีเมล">


        <input
            type="password"
            id="registerPassword"
            placeholder="รหัสผ่าน">


        <button
            class="main-btn"
            onclick="register()">

            สมัครสมาชิก

        </button>


        <div class="link">

            มีบัญชีอยู่แล้ว?

            <span onclick="showLogin()">
                เข้าสู่ระบบ
            </span>

        </div>

    </div>

</section>



<!-- ==================================================
     LOGIN PAGE
================================================== -->

<section
    id="loginPage"
    class="page">

    <div class="card">

        <div class="logo">
            💕
        </div>

        <h1>
            SUT Tinder
        </h1>

        <p class="subtitle">
            เข้าสู่ระบบ
        </p>


        <input
            type="email"
            id="loginEmail"
            placeholder="อีเมล">


        <input
            type="password"
            id="loginPassword"
            placeholder="รหัสผ่าน">


        <button
            class="main-btn"
            onclick="login()">

            เข้าสู่ระบบ

        </button>


        <div class="link">

            ยังไม่มีบัญชี?

            <span onclick="showRegister()">
                สมัครสมาชิก
            </span>

        </div>

    </div>

</section>



<!-- ==================================================
     HOME PAGE
================================================== -->

<section
    id="homePage"
    class="home">


    <header>

        <div class="logo-small">
            💕 SUT Tinder
        </div>

        <button
            class="logout"
            onclick="logout()">

            ออกจากระบบ

        </button>

    </header>


    <div class="container">


        <!-- PROFILE -->

        <div id="profileArea">

            <div class="profile-card">


                <div class="profile-photo">

                    <img
                        id="myPhoto"
                        alt="รูปโปรไฟล์">

                    <span
                        id="defaultPhoto"
                        class="default-photo">

                        👤

                    </span>

                </div>


                <div class="profile-info">

                    <div
                        id="profileName"
                        class="profile-name">

                        -

                    </div>


                    <div
                        id="profileDetails"
                        class="profile-details">

                        -

                    </div>


                    <div
                        id="profileBio"
                        class="profile-bio">

                        -

                    </div>

                </div>

            </div>


            <div class="actions">

                <button
                    class="action dislike"
                    onclick="dislike()">

                    ❌

                </button>


                <button
                    class="action like"
                    onclick="like()">

                    ❤️

                </button>

            </div>

        </div>


        <!-- EMPTY -->

        <div
            id="empty"
            class="empty">

            <h2>
                💕
            </h2>

            <h2>
                หมดคนให้ดูแล้ว
            </h2>

            <p>
                ลองกลับมาใหม่ภายหลังนะ
            </p>

        </div>


    </div>

</section>



<!-- ==================================================
     MATCH POPUP
================================================== -->

<div
    id="match"
    class="match">

    <div class="match-box">

        <div class="match-heart">
            💕
        </div>

        <h2>
            It's a Match!
        </h2>

        <p>

            คุณกับ

            <b id="matchName">
                -
            </b>

            ถูกใจกันแล้ว!

        </p>


        <button
            class="chat-btn"
            onclick="closeMatch()">

            เริ่มแชต

        </button>

    </div>

</div>



<script>

/* ==================================================
   VARIABLES
================================================== */

let currentProfile = 0;


/* ==================================================
   PROFILE DATA
================================================== */

const profiles = [

    {
        name: "มายด์",
        age: 21,
        faculty: "วิศวกรรมศาสตร์",
        year: "ปี 3",
        emoji: "👩🏻",
        bio: "ชอบคาเฟ่ ดูหนัง และถ่ายรูป ☕🎬📸"
    },

    {
        name: "แพร",
        age: 20,
        faculty: "เทคโนโลยีสังคม",
        year: "ปี 2",
        emoji: "👩🏼",
        bio: "สายเที่ยว ชอบทะเลและอาหารอร่อย 🌊🍜"
    },

    {
        name: "ฟ้า",
        age: 22,
        faculty: "วิทยาศาสตร์",
        year: "ปี 4",
        emoji: "👩🏽",
        bio: "ชอบฟังเพลง เล่นเกม และแมว 🎵🎮🐱"
    },

    {
        name: "น้ำ",
        age: 21,
        faculty: "แพทยศาสตร์",
        year: "ปี 3",
        emoji: "👩🏻‍🦰",
        bio: "ชอบออกกำลังกายและเดินเล่นตอนเย็น 🏃‍♀️🌅"
    }

];


/* ==================================================
   PAGE SWITCH
================================================== */

function hideAllPages() {

    document
        .querySelectorAll(".page, .home")
        .forEach(page => {

            page.classList.remove("active");

        });

}


function showRegister() {

    hideAllPages();

    document
        .getElementById("registerPage")
        .classList.add("active");
}


function showLogin() {

    hideAllPages();

    document
        .getElementById("loginPage")
        .classList.add("active");
}


function showHome() {

    hideAllPages();

    document
        .getElementById("homePage")
        .classList.add("active");

    loadUser();

    showProfile();

}


/* ==================================================
   PHOTO PREVIEW
================================================== */

document
    .getElementById("photoInput")
    .addEventListener(
        "change",
        function(event) {

            const file =
                event.target.files[0];

            if (!file) return;


            /* จำกัด 5MB */

            if (
                file.size >
                5 * 1024 * 1024
            ) {

                alert(
                    "รูปต้องมีขนาดไม่เกิน 5 MB"
                );

                event.target.value = "";

                return;
            }


            const reader =
                new FileReader();


            reader.onload =
                function(e) {

                    const img =
                        document.getElementById(
                            "previewPhoto"
                        );

                    img.src =
                        e.target.result;

                    img.style.display =
                        "block";


                    document
                        .getElementById(
                            "photoIcon"
                        )
                        .style.display =
                        "none";

                };


            reader.readAsDataURL(file);

        }
    );


/* ==================================================
   REGISTER
================================================== */

function register() {

    const name =
        document
            .getElementById("registerName")
            .value
            .trim();


    const email =
        document
            .getElementById("registerEmail")
            .value
            .trim();


    const password =
        document
            .getElementById("registerPassword")
            .value;


    const photo =
        document
            .getElementById("previewPhoto")
            .src;


    if (
        !name ||
        !email ||
        !password
    ) {

        alert(
            "กรุณากรอกข้อมูลให้ครบ"
        );

        return;
    }


    if (password.length < 6) {

        alert(
            "รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร"
        );

        return;
    }


    const user = {

        name: name,

        email: email,

        password: password,

        photo: photo || ""

    };


    localStorage.setItem(
        "sutTinderUser",
        JSON.stringify(user)
    );


    alert(
        "สมัครสมาชิกสำเร็จ 💕"
    );


    showLogin();

}


/* ==================================================
   LOGIN
================================================== */

function login() {

    const email =
        document
            .getElementById("loginEmail")
            .value
            .trim();


    const password =
        document
            .getElementById("loginPassword")
            .value;


    const savedUser =
        localStorage.getItem(
            "sutTinderUser"
        );


    if (!savedUser) {

        alert(
            "ยังไม่มีบัญชี กรุณาสมัครสมาชิกก่อน"
        );

        showRegister();

        return;
    }


    const user =
        JSON.parse(savedUser);


    if (
        email === user.email &&
        password === user.password
    ) {

        localStorage.setItem(
            "sutTinderLoggedIn",
            "true"
        );


        alert(
            "เข้าสู่ระบบสำเร็จ 💕"
        );


        showHome();

    } else {

        alert(
            "อีเมลหรือรหัสผ่านไม่ถูกต้อง"
        );

    }

}


/* ==================================================
   LOAD USER
================================================== */

function loadUser() {

    const savedUser =
        localStorage.getItem(
            "sutTinderUser"
        );


    if (!savedUser) {

        showRegister();

        return;
    }


    const user =
        JSON.parse(savedUser);


    document
        .getElementById(
            "profileName"
        )
        .textContent =
        user.name;


    document
        .getElementById(
            "profileDetails"
        )
        .textContent =
        "สมาชิก SUT";


    document
        .getElementById(
            "profileBio"
        )
        .textContent =
        "ยินดีต้อนรับสู่ SUT Tinder 💕";


    if (user.photo) {

        const img =
            document.getElementById(
                "myPhoto"
            );


        img.src =
            user.photo;


        img.style.display =
            "block";


        document
            .getElementById(
                "defaultPhoto"
            )
            .style.display =
            "none";

    }

}


/* ==================================================
   SHOW OTHER PROFILE
================================================== */

function showProfile() {

    if (
        currentProfile >=
        profiles.length
    ) {

        document
            .getElementById(
                "profileArea"
            )
            .style.display =
            "none";


        document
            .getElementById(
                "empty"
            )
            .style.display =
            "block";


        return;
    }


    const person =
        profiles[currentProfile];


    const photo =
        document.getElementById(
            "myPhoto"
        );


    /*
       ใช้ Emoji เป็นรูปจำลอง
       สำหรับคนอื่น
    */

    photo.style.display =
        "none";


    document
        .getElementById(
            "defaultPhoto"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "defaultPhoto"
        )
        .textContent =
        person.emoji;


    document
        .getElementById(
            "profileName"
        )
        .textContent =
        person.name +
        ", " +
        person.age;


    document
        .getElementById(
            "profileDetails"
        )
        .textContent =
        person.faculty +
        " • " +
        person.year;


    document
        .getElementById(
            "profileBio"
        )
        .textContent =
        person.bio;

}


/* ==================================================
   DISLIKE
================================================== */

function dislike() {

    currentProfile++;

    showProfile();

}


/* ==================================================
   LIKE
================================================== */

function like() {

    if (
        currentProfile >=
        profiles.length
    ) {
        return;
    }


    const person =
        profiles[currentProfile];


    /*
       จำลอง Match
    */

    const isMatch =
        Math.random() > 0.4;


    if (isMatch) {

        document
            .getElementById(
                "matchName"
            )
            .textContent =
            person.name;


        document
            .getElementById(
                "match"
            )
            .style.display =
            "flex";

    } else {

        currentProfile++;

        showProfile();

    }

}


/* ==================================================
   CLOSE MATCH
================================================== */

function closeMatch() {

    document
        .getElementById(
            "match"
        )
        .style.display =
        "none";


    currentProfile++;

    showProfile();

}


/* ==================================================
   LOGOUT
================================================== */

function logout() {

    localStorage.removeItem(
        "sutTinderLoggedIn"
    );


    currentProfile = 0;


    alert(
        "ออกจากระบบแล้ว"
    );


    showLogin();

}


/* ==================================================
   AUTO LOGIN
================================================== */

const loggedIn =
    localStorage.getItem(
        "sutTinderLoggedIn"
    );


if (loggedIn === "true") {

    showHome();

} else {

    showRegister();

}

</script>

</body>
</html>
