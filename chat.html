<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUT Tinder 💕 Chat</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#ea6666,#a24b68);
}

.chat-app {
    width: 100%;
    max-width: 700px;
    height: 100vh;
    margin: auto;

    background: #f5f5f5;

    display: flex;
    flex-direction: column;

    box-shadow:
        0 0 40px rgba(0,0,0,.25);
}

/* HEADER */

.chat-header {
    height: 75px;

    padding: 10px 15px;

    display: flex;
    align-items: center;

    gap: 10px;

    background:
        linear-gradient(
            135deg,
            #e75480,
            #b44d72
        );

    color: white;
}

.back-btn,
.friend-btn {

    width: 42px;
    height: 42px;

    border: none;
    border-radius: 50%;

    background:
        rgba(255,255,255,.2);

    color: white;

    font-size: 21px;

    cursor: pointer;
}

.header-photo {

    width: 48px;
    height: 48px;

    border-radius: 50%;

    background: #ffd6df;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 28px;

    flex-shrink: 0;

}

.header-info {

    flex: 1;
    min-width: 0;

}

.header-name {

    font-size: 18px;
    font-weight: bold;

}

.online {

    font-size: 12px;

    margin-top: 3px;

    opacity: .85;

}

.clear-btn {

    border: none;

    background:
        rgba(255,255,255,.15);

    color: white;

    padding: 8px 10px;

    border-radius: 15px;

    cursor: pointer;

}

/* MESSAGES */

.messages {

    flex: 1;

    padding: 20px 15px;

    overflow-y: auto;

    background: white;

}

.message-row {

    display: flex;

    margin-bottom: 12px;

}

.message-row.me {

    justify-content: flex-end;

}

.message {

    max-width: 75%;

    padding: 11px 15px;

    border-radius: 18px;

    font-size: 15px;

    line-height: 1.45;

    word-break: break-word;

}

.message-row.other .message {

    background: #e8e8e8;

    color: #333;

    border-bottom-left-radius: 5px;

}

.message-row.me .message {

    background: #e75480;

    color: white;

    border-bottom-right-radius: 5px;

}

.time {

    font-size: 10px;

    opacity: .65;

    margin-top: 4px;

    text-align: right;

}

/* INPUT */

.chat-input-area {

    padding: 12px;

    background: white;

    border-top: 1px solid #ddd;

    display: flex;

    gap: 8px;

}

.chat-input {

    flex: 1;

    min-width: 0;

    border: none;

    outline: none;

    background: #f1f1f1;

    border-radius: 25px;

    padding: 13px 16px;

    font-size: 15px;

}

.send-btn {

    width: 48px;
    height: 48px;

    border: none;

    border-radius: 50%;

    background: #e75480;

    color: white;

    font-size: 20px;

    cursor: pointer;

}

/* FRIEND PANEL */

.friend-panel {

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,.6);

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    z-index: 100;

}

.friend-box {

    width: 100%;

    max-width: 420px;

    max-height: 80vh;

    overflow-y: auto;

    background: white;

    color: #333;

    border-radius: 25px;

    padding: 22px;

}

.friend-title {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 15px;

}

.friend-title h2 {

    margin: 0;

    color: #e75480;

}

.close-friends {

    width: 38px;
    height: 38px;

    border: none;

    border-radius: 50%;

    background: #f2f2f2;

    font-size: 20px;

    cursor: pointer;

}

.friend-item {

    display: flex;

    align-items: center;

    gap: 12px;

    padding: 12px;

    margin-bottom: 8px;

    border-radius: 16px;

    cursor: pointer;

}

.friend-item:hover {

    background: #fff0f4;

}

.friend-avatar {

    width: 52px;
    height: 52px;

    border-radius: 50%;

    background: #ffd6df;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 27px;

}

.friend-info {

    flex: 1;

}

.friend-name {

    font-weight: bold;

}

.friend-status {

    color: #888;

    font-size: 13px;

    margin-top: 4px;

}

.friend-arrow {

    color: #e75480;

    font-size: 25px;

}

</style>
</head>

<body>


<div class="chat-app">

    <!-- HEADER -->

    <header class="chat-header">

        <button
            class="back-btn"
            onclick="goHome()">

            ←

        </button>


        <button
            class="friend-btn"
            onclick="openFriends()">

            👥

        </button>


        <div class="header-photo">

            <span id="chatEmoji">
                👤
            </span>

        </div>


        <div class="header-info">

            <div
                class="header-name"
                id="chatName">

                Match 💕

            </div>


            <div class="online">

                ● ออนไลน์

            </div>

        </div>


        <button
            class="clear-btn"
            onclick="clearChat()">

            ล้างแชต

        </button>

    </header>


    <!-- MESSAGES -->

    <main
        class="messages"
        id="messages">

    </main>


    <!-- INPUT -->

    <form
        class="chat-input-area"
        onsubmit="sendMessage(event)">

        <input
            id="messageInput"
            class="chat-input"
            type="text"
            placeholder="พิมพ์ข้อความ..."
            autocomplete="off">


        <button
            class="send-btn"
            type="submit">

            ➤

        </button>

    </form>

</div>



<!-- FRIEND PANEL -->

<div
    class="friend-panel"
    id="friendPanel">

    <div class="friend-box">

        <div class="friend-title">

            <h2>
                👥 เพื่อนของฉัน
            </h2>


            <button
                class="close-friends"
                onclick="closeFriends()">

                ✕

            </button>

        </div>


        <div id="friendList"></div>

    </div>

</div>



<script>

/* =========================
   LOGIN
========================= */

const loggedIn =
    localStorage.getItem(
        "sutTinderLoggedIn"
    );


const savedUser =
    localStorage.getItem(
        "sutTinderUser"
    );


if (
    loggedIn !== "true" ||
    !savedUser
) {

    window.location.href =
        "login.html";

}


/* =========================
   FRIENDS
========================= */

const friends = [

    {
        name: "มายด์",
        emoji: "👩🏻"
    },

    {
        name: "แพร",
        emoji: "👩🏼"
    },

    {
        name: "ฟ้า",
        emoji: "👩🏽"
    },

    {
        name: "น้ำ",
        emoji: "👩🏻‍🦰"
    },

    {
        name: "พลอย",
        emoji: "👩🏻‍🦱"
    },

    {
        name: "มิน",
        emoji: "👩🏼‍🦰"
    }

];


let currentFriend =
    localStorage.getItem(
        "sutTinderMatchName"
    ) ||
    friends[0].name;


/* =========================
   CURRENT FRIEND
========================= */

function getFriend() {

    return friends.find(
        friend =>
            friend.name === currentFriend
    ) || friends[0];

}


/* =========================
   STORAGE
========================= */

function getStorageKey() {

    return "sutTinderChat_" +
        currentFriend;

}


/* =========================
   HEADER
========================= */

function loadHeader() {

    const friend =
        getFriend();


    document
        .getElementById("chatName")
        .textContent =
        friend.name + " 💕";


    document
        .getElementById("chatEmoji")
        .textContent =
        friend.emoji;

}


/* =========================
   LOAD MESSAGES
========================= */

function loadMessages() {

    const messages =
        JSON.parse(

            localStorage.getItem(
                getStorageKey()
            ) || "[]"

        );


    const container =
        document.getElementById(
            "messages"
        );


    container.innerHTML = "";


    if (
        messages.length === 0
    ) {

        container.innerHTML = `

            <div style="
                text-align:center;
                color:#888;
                padding:60px 10px;
            ">

                <div style="
                    font-size:60px;
                ">

                    💕

                </div>


                <h3 style="
                    color:#e75480;
                ">

                    คุณ Match กับ
                    ${escapeHTML(currentFriend)}

                </h3>


                <p>

                    เริ่มต้นพูดคุยกันได้เลย!

                </p>

            </div>

        `;

        return;

    }


    messages.forEach(
        message => {

            createMessage(
                message.text,
                message.sender,
                message.time
            );

        }
    );


    scrollBottom();

}


/* =========================
   SEND
========================= */

function sendMessage(event) {

    event.preventDefault();


    const input =
        document.getElementById(
            "messageInput"
        );


    const text =
        input.value.trim();


    if (!text) {

        return;

    }


    const messages =
        JSON.parse(

            localStorage.getItem(
                getStorageKey()
            ) || "[]"

        );


    messages.push({

        text: text,

        sender: "me",

        time: getTime()

    });


    localStorage.setItem(

        getStorageKey(),

        JSON.stringify(messages)

    );


    input.value = "";


    loadMessages();


    fakeReply();

}


/* =========================
   CREATE MESSAGE
========================= */

function createMessage(
    text,
    sender,
    time
) {

    const container =
        document.getElementById(
            "messages"
        );


    const row =
        document.createElement(
            "div"
        );


    row.className =
        "message-row " +
        (
            sender === "me"
            ? "me"
            : "other"
        );


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "message";


    bubble.innerHTML =

        escapeHTML(text) +

        `<div class="time">
            ${escapeHTML(time)}
        </div>`;


    row.appendChild(
        bubble
    );


    container.appendChild(
        row
    );

}


/* =========================
   AUTO REPLY
========================= */

function fakeReply() {

    const replies = [

        "สวัสดี 😊",

        "เป็นไงบ้างวันนี้",

        "ยินดีที่ได้รู้จักนะ 💕",

        "เรียนอยู่ที่ SUT เหมือนกันเลย",

        "ชอบไปคาเฟ่เหมือนกันเลย ☕",

        "555 จริงเหรอ 😂",

        "น่าสนใจมากเลย",

        "ไว้คุยกันอีกนะ 💕"

    ];


    const reply =
        replies[
            Math.floor(
                Math.random() *
                replies.length
            )
        ];


    setTimeout(
        function() {


            const messages =
                JSON.parse(

                    localStorage.getItem(
                        getStorageKey()
                    ) || "[]"

                );


            messages.push({

                text: reply,

                sender: "other",

                time: getTime()

            });


            localStorage.setItem(

                getStorageKey(),

                JSON.stringify(messages)

            );


            loadMessages();


        },

        1200
    );

}


/* =========================
   OPEN FRIENDS
========================= */

function openFriends() {

    const list =
        document.getElementById(
            "friendList"
        );


    list.innerHTML = "";


    friends.forEach(
        friend => {


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "friend-item";


            item.onclick =
                function() {

                    selectFriend(
                        friend.name
                    );

                };


            item.innerHTML = `

                <div class="friend-avatar">

                    ${friend.emoji}

                </div>


                <div class="friend-info">

                    <div class="friend-name">

                        ${escapeHTML(
                            friend.name
                        )}

                    </div>


                    <div class="friend-status">

                        💕 Match แล้ว

                    </div>

                </div>


                <div class="friend-arrow">

                    ›

                </div>

            `;


            list.appendChild(
                item
            );

        }
    );


    document
        .getElementById(
            "friendPanel"
        )
        .style.display =
        "flex";

}


/* =========================
   CLOSE FRIENDS
========================= */

function closeFriends() {

    document
        .getElementById(
            "friendPanel"
        )
        .style.display =
        "none";

}


/* =========================
   SELECT FRIEND
========================= */

function selectFriend(name) {

    currentFriend =
        name;


    localStorage.setItem(

        "sutTinderMatchName",

        name

    );


    loadHeader();

    loadMessages();

    closeFriends();

}


/* =========================
   CLEAR
========================= */

function clearChat() {

    if (
        !confirm(
            "ต้องการล้างแชตนี้หรือไม่?"
        )
    ) {

        return;

    }


    localStorage.removeItem(
        getStorageKey()
    );


    loadMessages();

}


/* =========================
   HOME
========================= */

function goHome() {

    window.location.href =
        "home.html";

}


/* =========================
   TIME
========================= */

function getTime() {

    return new Date()
        .toLocaleTimeString(
            "th-TH",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );

}


/* =========================
   SECURITY
========================= */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}


/* =========================
   SCROLL
========================= */

function scrollBottom() {

    const container =
        document.getElementById(
            "messages"
        );


    setTimeout(
        function() {

            container.scrollTop =
                container.scrollHeight;

        },

        50
    );

}


/* =========================
   START
========================= */

loadHeader();

loadMessages();

</script>

</body>
</html>
