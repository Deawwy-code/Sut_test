```html
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUT Tinder - Chat</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #3a1800, #120b06 55%, #080808);
      color: white;
    }

    header {
      height: 65px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(20, 12, 7, 0.98);
      border-bottom: 1px solid #ff7a00;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .back {
      border: none;
      background: transparent;
      color: white;
      font-size: 24px;
      cursor: pointer;
    }

    .header-info {
      flex: 1;
    }

    .header-name {
      font-size: 18px;
      font-weight: bold;
      color: #ff9800;
    }

    .header-status {
      color: #888;
      font-size: 12px;
      margin-top: 3px;
    }

    .container {
      width: 95%;
      max-width: 700px;
      margin: auto;
      padding: 15px 0 90px;
    }

    .select-box {
      margin-bottom: 15px;
    }

    .select-box select {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #444;
      background: #18120d;
      color: white;
      font-size: 15px;
      outline: none;
    }

    .select-box select:focus {
      border-color: #ff7a00;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 60px 20px;
    }

    .messages {
      min-height: 55vh;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message-row {
      display: flex;
      width: 100%;
    }

    .message-row.me {
      justify-content: flex-end;
    }

    .message-row.other {
      justify-content: flex-start;
    }

    .message {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 17px;
      line-height: 1.5;
      word-break: break-word;
    }

    .message.me {
      background: linear-gradient(135deg, #ff9800, #ff5e00);
      color: white;
      border-bottom-right-radius: 5px;
    }

    .message.other {
      background: #252525;
      color: #eee;
      border-bottom-left-radius: 5px;
    }

    .time {
      display: block;
      font-size: 10px;
      opacity: 0.65;
      margin-top: 3px;
      text-align: right;
    }

    .input-area {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px;
      background: rgba(15, 10, 6, 0.98);
      border-top: 1px solid #333;
    }

    .input-box {
      width: 95%;
      max-width: 700px;
      margin: auto;
      display: flex;
      gap: 8px;
    }

    #messageInput {
      flex: 1;
      padding: 13px 15px;
      border-radius: 15px;
      border: 1px solid #444;
      background: #181818;
      color: white;
      font-size: 15px;
      outline: none;
    }

    #messageInput:focus {
      border-color: #ff7a00;
    }

    .send-btn {
      width: 55px;
      border: none;
      border-radius: 15px;
      background: linear-gradient(135deg, #ff9800, #ff5e00);
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    .clear-btn {
      margin-top: 10px;
      width: 100%;
      padding: 8px;
      border: 1px solid #333;
      border-radius: 10px;
      background: transparent;
      color: #777;
      cursor: pointer;
    }

    .clear-btn:hover {
      color: #ff6b00;
      border-color: #ff6b00;
    }
  </style>
</head>

<body>

<header>

  <button class="back" onclick="goHome()">
    ←
  </button>

  <div class="header-info">

    <div class="header-name" id="headerName">
      เลือกคนที่จะแชต
    </div>

    <div class="header-status">
      SUT Tinder 💬
    </div>

  </div>

</header>


<div class="container">

  <div class="select-box">

    <select id="matchSelect" onchange="changeChat()">
      <option value="">
        -- เลือก Match --
      </option>
    </select>

  </div>


  <div
    class="messages"
    id="messages"
  ></div>


  <button
    class="clear-btn"
    onclick="clearChat()"
  >
    🗑️ ล้างแชตนี้
  </button>

</div>


<div class="input-area">

  <div class="input-box">

    <input
      id="messageInput"
      type="text"
      placeholder="พิมพ์ข้อความ..."
      autocomplete="off"
    >

    <button
      class="send-btn"
      onclick="sendMessage()"
    >
      ➤
    </button>

  </div>

</div>


<script>

  let me = null;
  let selectedUser = null;


  // =================================
  // ดึง Users
  // =================================

  function getUsers() {

    return JSON.parse(
      localStorage.getItem("sutTinderUsers")
    ) || [];

  }


  // =================================
  // ดึงผู้ใช้ปัจจุบัน
  // =================================

  function getMe() {

    const current =
      JSON.parse(
        localStorage.getItem("sutTinderUser")
      );

    if (!current) return null;

    const users = getUsers();

    return users.find(
      u => u.id === current.id
    ) || null;

  }


  // =================================
  // สร้าง ID ของห้องแชต
  // =================================

  function getChatKey(userId1, userId2) {

    const ids = [
      userId1,
      userId2
    ].sort();

    return "sutTinderChat_" +
      ids[0] +
      "_" +
      ids[1];

  }


  // =================================
  // โหลดรายชื่อ Match
  // =================================

  function loadMatches() {

    me = getMe();

    if (!me) {

      window.location.href =
        "login.html";

      return;

    }


    const users = getUsers();

    const matchIds =
      Array.isArray(me.matches)
        ? me.matches
        : [];


    const select =
      document.getElementById("matchSelect");


    select.innerHTML = `
      <option value="">
        -- เลือก Match --
      </option>
    `;


    matchIds.forEach(id => {

      const user =
        users.find(
          u => u.id === id
        );

      if (!user) return;


      const option =
        document.createElement("option");

      option.value = user.id;

      option.textContent =
        `${user.name} ❤️`;

      select.appendChild(option);

    });


    // ถ้ามี Chat ที่เลือกไว้จากหน้า Home
    const savedId =
      localStorage.getItem(
        "sutTinderSelectedChatId"
      );


    if (
      savedId &&
      matchIds.includes(savedId)
    ) {

      select.value = savedId;

      selectedUser =
        users.find(
          u => u.id === savedId
        ) || null;

      renderChat();

      localStorage.removeItem(
        "sutTinderSelectedChatId"
      );

    } else {

      document.getElementById(
        "messages"
      ).innerHTML = `
        <div class="empty">
          💬<br><br>
          เลือก Match ด้านบนเพื่อเริ่มแชต
        </div>
      `;

    }

  }


  // =================================
  // เปลี่ยนคนที่แชต
  // =================================

  function changeChat() {

    const id =
      document.getElementById(
        "matchSelect"
      ).value;


    if (!id) {

      selectedUser = null;

      document.getElementById(
        "headerName"
      ).innerText =
        "เลือกคนที่จะแชต";

      document.getElementById(
        "messages"
      ).innerHTML = `
        <div class="empty">
          💬<br><br>
          เลือก Match ด้านบนเพื่อเริ่มแชต
        </div>
      `;

      return;

    }


    const users = getUsers();

    selectedUser =
      users.find(
        u => u.id === id
      ) || null;


    renderChat();

  }


  // =================================
  // แสดงข้อความ
  // =================================

  function renderChat() {

    if (!selectedUser || !me) return;


    document.getElementById(
      "headerName"
    ).innerText =
      "💬 " + selectedUser.name;


    const key =
      getChatKey(
        me.id,
        selectedUser.id
      );


    const messages =
      JSON.parse(
        localStorage.getItem(key)
      ) || [];


    const box =
      document.getElementById(
        "messages"
      );


    if (messages.length === 0) {

      box.innerHTML = `
        <div class="empty">
          ❤️<br><br>
          เริ่มคุยกับ ${escapeHTML(selectedUser.name)} ได้เลย
        </div>
      `;

      return;

    }


    box.innerHTML = "";


    messages.forEach(message => {

      const row =
        document.createElement("div");

      row.className =
        "message-row " +
        (
          message.sender === me.id
            ? "me"
            : "other"
        );


      const bubble =
        document.createElement("div");

      bubble.className =
        "message " +
        (
          message.sender === me.id
            ? "me"
            : "other"
        );


      bubble.innerHTML = `
        ${escapeHTML(message.text)}
        <span class="time">
          ${escapeHTML(message.time)}
        </span>
      `;


      row.appendChild(bubble);

      box.appendChild(row);

    });


    // เลื่อนไปล่างสุด
    window.scrollTo({
      top: document.body.scrollHeight,
      behavior: "smooth"
    });

  }


  // =================================
  // ส่งข้อความ
  // =================================

  function sendMessage() {

    if (!selectedUser || !me) {

      alert("กรุณาเลือก Match ก่อน");

      return;

    }


    const input =
      document.getElementById(
        "messageInput"
      );


    const text =
      input.value.trim();


    if (!text) return;


    const key =
      getChatKey(
        me.id,
        selectedUser.id
      );


    const messages =
      JSON.parse(
        localStorage.getItem(key)
      ) || [];


    const now =
      new Date();


    const time =
      now.toLocaleTimeString(
        "th-TH",
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      );


    messages.push({

      text: text,

      sender: me.id,

      time: time

    });


    localStorage.setItem(
      key,
      JSON.stringify(messages)
    );


    input.value = "";

    renderChat();

    input.focus();

  }


  // =================================
  // Enter เพื่อส่ง
  // =================================

  document
    .getElementById("messageInput")
    .addEventListener(
      "keydown",
      function(e) {

        if (e.key === "Enter") {

          e.preventDefault();

          sendMessage();

        }

      }
    );


  // =================================
  // ล้างแชต
  // =================================

  function clearChat() {

    if (!selectedUser || !me) {

      return;

    }


    const confirmClear =
      confirm(
        "ต้องการล้างข้อความในแชตนี้หรือไม่?"
      );


    if (!confirmClear) return;


    const key =
      getChatKey(
        me.id,
        selectedUser.id
      );


    localStorage.removeItem(key);

    renderChat();

  }


  // =================================
  // กลับ Home
  // =================================

  function goHome() {

    window.location.href =
      "home.html";

  }


  // =================================
  // ป้องกัน HTML
  // =================================

  function escapeHTML(text) {

    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  // =================================
  // เริ่มต้น
  // =================================

  loadMatches();

</script>

</body>
</html>
