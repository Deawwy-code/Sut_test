<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUT Tinder - เข้าสู่ระบบ</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ea6666, #a24b68);
    color: white;
}

.card {
    width: 90%;
    max-width: 430px;
    padding: 40px 30px;
    text-align: center;
    background: rgba(255,255,255,.16);
    border-radius: 24px;
    box-shadow: 0 20px 50px rgba(0,0,0,.25);
    backdrop-filter: blur(12px);
}

.logo {
    font-size: 55px;
}

h1 {
    font-size: 40px;
    margin: 5px 0 10px;
}

.subtitle {
    font-size: 18px;
    margin-bottom: 30px;
}

input {
    width: 100%;
    padding: 15px;
    margin: 8px 0;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    outline: none;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 15px;
    border: none;
    border-radius: 999px;
    background: white;
    color: #ca54e2;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.register {
    margin-top: 20px;
}

.register a {
    color: white;
    font-weight: bold;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">💕</div>

    <h1>SUT Tinder</h1>

    <p class="subtitle">เข้าสู่ระบบ</p>

    <input
        type="email"
        id="email"
        placeholder="อีเมล"
    >

    <input
        type="password"
        id="password"
        placeholder="รหัสผ่าน"
    >

    <button onclick="login()">
        เข้าสู่ระบบ
    </button>

    <div class="register">
        ยังไม่มีบัญชี?
        <a onclick="goRegister()">สมัครสมาชิก</a>
    </div>

</div>

<script>

function login() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const savedUser =
        localStorage.getItem("sutTinderUser");

    if (!savedUser) {
        alert("ยังไม่มีบัญชี กรุณาสมัครสมาชิกก่อน");
        return;
    }

    const user = JSON.parse(savedUser);

    if (
        email === user.email &&
        password === user.password
    ) {

        // จำสถานะว่าเข้าสู่ระบบแล้ว
        localStorage.setItem(
            "sutTinderLoggedIn",
            "true"
        );

        alert("เข้าสู่ระบบสำเร็จ 💕");

        window.location.href = "home.html";

    } else {

        alert("อีเมลหรือรหัสผ่านไม่ถูกต้อง");

    }
}

function goRegister() {
    window.location.href = "index.html";
}

</script>

</body>
</html>
