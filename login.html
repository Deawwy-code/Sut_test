```html
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUT Tinder - Login</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at top, #3a1800, #120b06 55%, #080808);
      color: white;
    }

    .box {
      width: 90%;
      max-width: 420px;
      padding: 35px 28px;
      background: rgba(25, 18, 12, 0.95);
      border: 1px solid #ff7a00;
      border-radius: 22px;
      box-shadow: 0 0 35px rgba(255, 122, 0, 0.25);
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      color: #ff8a00;
      margin-bottom: 8px;
    }

    .sub {
      text-align: center;
      color: #bbb;
      margin-bottom: 28px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 1px solid #444;
      border-radius: 12px;
      background: #151515;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #ff7a00;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #ff9800, #ff5e00);
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    button:hover {
      opacity: 0.9;
    }

    .link {
      text-align: center;
      margin-top: 22px;
      color: #aaa;
    }

    .link a {
      color: #ff8a00;
      text-decoration: none;
      font-weight: bold;
    }

    .link a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">🧡 SUT Tinder</div>
    <div class="sub">เข้าสู่ระบบเพื่อเริ่มจับคู่</div>

    <input
      type="email"
      id="email"
      placeholder="อีเมล"
    >

    <input
      type="password"
      id="password"
      placeholder="รหัสผ่าน"
    >

    <button onclick="login()">
      เข้าสู่ระบบ
    </button>

    <div class="link">
      ยังไม่มีบัญชี?
      <a href="index.html">สมัครสมาชิก</a>
    </div>

  </div>

  <script>

    function login() {

      const email = document
        .getElementById("email")
        .value
        .trim();

      const password = document
        .getElementById("password")
        .value;

      if (!email || !password) {
        alert("กรุณากรอกอีเมลและรหัสผ่าน");
        return;
      }

      // ดึงข้อมูลผู้ใช้ทั้งหมด
      const users =
        JSON.parse(
          localStorage.getItem("sutTinderUsers")
        ) || [];

      // ค้นหาผู้ใช้
      const user = users.find(u =>
        u.email.toLowerCase() === email.toLowerCase() &&
        u.password === password
      );

      // ไม่พบผู้ใช้
      if (!user) {
        alert("อีเมลหรือรหัสผ่านไม่ถูกต้อง");
        return;
      }

      // ตั้งสถานะ Login
      localStorage.setItem(
        "sutTinderLoggedIn",
        "true"
      );

      // บันทึกผู้ใช้ที่ Login อยู่
      localStorage.setItem(
        "sutTinderUser",
        JSON.stringify(user)
      );

      // สำรองข้อมูลโปรไฟล์
      localStorage.setItem(
        "sutTinderMyProfile",
        JSON.stringify(user)
      );

      // ไปหน้า Home
      window.location.href = "home.html";
    }

  </script>

</body>
</html>
```
