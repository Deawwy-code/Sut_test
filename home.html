```html
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUT Tinder - Home</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #3a1800, #120b06 55%, #080808);
      color: white;
    }

    header {
      height: 65px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(20, 12, 7, 0.95);
      border-bottom: 1px solid #ff7a00;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      color: #ff8a00;
      font-size: 22px;
      font-weight: bold;
    }

    .menu {
      display: flex;
      gap: 8px;
    }

    .menu button {
      border: 1px solid #555;
      background: #181818;
      color: white;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
    }

    .menu button:hover {
      border-color: #ff7a00;
      color: #ff9800;
    }

    .container {
      width: 95%;
      max-width: 500px;
      margin: 25px auto 50px;
    }

    .welcome {
      text-align: center;
      color: #ccc;
      margin-bottom: 18px;
    }

    .card {
      background: #18120d;
      border: 1px solid #ff7a00;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(255, 122, 0, 0.2);
    }

    .photo {
      width: 100%;
      height: 400px;
      background: #282828;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-size: 80px;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .info {
      padding: 20px;
    }

    .name {
      font-size: 28px;
      font-weight: bold;
    }

    .details {
      color: #bbb;
      margin-top: 8px;
      line-height: 1.7;
    }

    .bio {
      margin-top: 12px;
      color: #ddd;
      line-height: 1.6;
    }

    .view-profile {
      width: 100%;
      margin-top: 18px;
      padding: 13px;
      border: 1px solid #ff7a00;
      border-radius: 12px;
      background: transparent;
      color: #ff9800;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .actions {
      display: flex;
      gap: 12px;
      padding: 0 20px 20px;
    }

    .actions button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .dislike {
      background: #333;
      color: white;
    }

    .like {
      background: linear-gradient(135deg, #ff9800, #ff5e00);
      color: white;
    }

    .empty {
      padding: 50px 20px;
      text-align: center;
      background: #18120d;
      border: 1px solid #444;
      border-radius: 20px;
      color: #bbb;
    }

    .match-section {
      margin-top: 35px;
    }

    .section-title {
      font-size: 22px;
      color: #ff9800;
      margin-bottom: 15px;
    }

    .match-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      margin-bottom: 10px;
      background: #18120d;
      border: 1px solid #333;
      border-radius: 15px;
    }

    .match-photo {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-size: 25px;
      flex-shrink: 0;
    }

    .match-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .match-info {
      flex: 1;
    }

    .match-name {
      font-weight: bold;
    }

    .match-detail {
      color: #999;
      font-size: 13px;
      margin-top: 4px;
    }

    .chat-btn {
      border: none;
      border-radius: 10px;
      padding: 9px 12px;
      background: #ff7a00;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 100;
      padding: 20px;
      overflow-y: auto;
    }

    .modal-box {
      width: 100%;
      max-width: 450px;
      margin: 30px auto;
      background: #18120d;
      border: 1px solid #ff7a00;
      border-radius: 22px;
      overflow: hidden;
    }

    .modal-photo {
      width: 100%;
      height: 350px;
      background: #292929;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 80px;
    }

    .modal-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .modal-info {
      padding: 20px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      padding: 0 20px 20px;
    }

    .modal-actions button {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
    }

    .close-btn {
      background: #333;
      color: white;
    }

    .modal-like {
      background: linear-gradient(135deg, #ff9800, #ff5e00);
      color: white;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">🧡 SUT Tinder</div>

  <div class="menu">
    <button onclick="goProfile()">👤</button>
    <button onclick="goChat()">💬</button>
    <button onclick="logout()">ออก</button>
  </div>
</header>

<div class="container">

  <div class="welcome" id="welcome">
    กำลังโหลด...
  </div>

  <div id="profileArea"></div>

  <div class="match-section">
    <div class="section-title">
      💕 Match ของฉัน
    </div>

    <div id="matchList"></div>
  </div>

</div>

<!-- PROFILE MODAL -->
<div class="modal" id="profileModal">

  <div class="modal-box">

    <div class="modal-photo" id="modalPhoto">
      👤
    </div>

    <div class="modal-info">

      <div class="name" id="modalName">
        -
      </div>

      <div class="details" id="modalDetails">
        -
      </div>

      <div class="bio" id="modalBio">
        -
      </div>

    </div>

    <div class="modal-actions">

      <button class="close-btn" onclick="closeModal()">
        ปิด
      </button>

      <button class="modal-like" onclick="likeCurrent()">
        ❤️ Like
      </button>

    </div>

  </div>

</div>

<script>

  let currentProfile = null;

  // ==============================
  // ดึงข้อมูลทั้งหมด
  // ==============================

  function getUsers() {

    return JSON.parse(
      localStorage.getItem("sutTinderUsers")
    ) || [];

  }


  // ==============================
  // ดึงข้อมูลผู้ใช้ปัจจุบัน
  // ==============================

  function getMe() {

    const current =
      JSON.parse(
        localStorage.getItem("sutTinderUser")
      );

    if (!current) return null;

    const users = getUsers();

    return users.find(
      u => u.id === current.id
    ) || null;

  }


  // ==============================
  // บันทึกข้อมูล
  // ==============================

  function saveUsers(users, me) {

    localStorage.setItem(
      "sutTinderUsers",
      JSON.stringify(users)
    );

    localStorage.setItem(
      "sutTinderUser",
      JSON.stringify(me)
    );

    localStorage.setItem(
      "sutTinderMyProfile",
      JSON.stringify(me)
    );

  }


  // ==============================
  // เริ่มต้น
  // ==============================

  function init() {

    const me = getMe();

    if (!me) {

      window.location.href = "login.html";
      return;

    }

    document.getElementById("welcome").innerText =
      "สวัสดี " + me.name + " 👋";

    showNextProfile();
    renderMatches();

  }


  // ==============================
  // แสดงคนเพศตรงข้าม
  // ==============================

  function showNextProfile() {

    const me = getMe();

    if (!me) return;

    const users = getUsers();

    const profiles = users.filter(
      u =>
        u.id !== me.id &&
        u.gender !== me.gender
    );

    if (profiles.length === 0) {

      document.getElementById("profileArea").innerHTML = `
        <div class="empty">
          <div style="font-size:50px;">😅</div>
          <h3>ยังไม่มีคนให้ค้นหา</h3>
          <p>ลองเพิ่มผู้ใช้งานคนอื่นก่อน</p>
        </div>
      `;

      currentProfile = null;
      return;

    }

    /*
      เลือกคนที่ยังไม่ได้ Like หรือ Dislike
      โดยใช้ disliked เป็นข้อมูลเสริม
    */

    const available = profiles.filter(u => {

      const liked =
        me.likes?.includes(u.id);

      const disliked =
        me.disliked?.includes(u.id);

      return !liked && !disliked;

    });

    if (available.length === 0) {

      document.getElementById("profileArea").innerHTML = `
        <div class="empty">
          <div style="font-size:50px;">🎉</div>
          <h3>ดูครบหมดแล้ว!</h3>
          <p>ยังไม่มีโปรไฟล์ใหม่ให้แสดง</p>
        </div>
      `;

      currentProfile = null;
      return;

    }

    currentProfile = available[0];

    renderProfile(currentProfile);

  }


  // ==============================
  // แสดง Card
  // ==============================

  function renderProfile(user) {

    const photo = user.photo
      ? `<img src="${user.photo}" alt="profile">`
      : `👤`;

    document.getElementById("profileArea").innerHTML = `

      <div class="card">

        <div class="photo">
          ${photo}
        </div>

        <div class="info">

          <div class="name">
            ${escapeHTML(user.name)}, ${user.age}
          </div>

          <div class="details">
            👤 ${escapeHTML(user.gender)}<br>
            🎓 ${escapeHTML(user.faculty || "-")}<br>
            📚 ปี ${escapeHTML(user.year || "-")}
          </div>

          <div class="bio">
            ${escapeHTML(user.bio || "ยังไม่มีคำแนะนำตัว")}
          </div>

          <button
            class="view-profile"
            onclick="openProfile()"
          >
            👀 ดูโปรไฟล์เพิ่มเติม
          </button>

        </div>

        <div class="actions">

          <button
            class="dislike"
            onclick="dislikeCurrent()"
          >
            ❌ Dislike
          </button>

          <button
            class="like"
            onclick="likeCurrent()"
          >
            ❤️ Like
          </button>

        </div>

      </div>
    `;

  }


  // ==============================
  // เปิด Profile Modal
  // ==============================

  function openProfile() {

    if (!currentProfile) return;

    const user = currentProfile;

    const photo = user.photo
      ? `<img src="${user.photo}" alt="profile">`
      : `👤`;

    document.getElementById("modalPhoto").innerHTML =
      photo;

    document.getElementById("modalName").innerText =
      `${user.name}, ${user.age}`;

    document.getElementById("modalDetails").innerHTML =
      `👤 ${escapeHTML(user.gender)}<br>
       🎓 ${escapeHTML(user.faculty || "-")}<br>
       📚 ชั้นปี ${escapeHTML(user.year || "-")}<br>
       ✉️ ${escapeHTML(user.email || "-")}`;

    document.getElementById("modalBio").innerText =
      user.bio || "ยังไม่มีคำแนะนำตัว";

    document.getElementById("profileModal").style.display =
      "block";

  }


  // ==============================
  // ปิด Modal
  // ==============================

  function closeModal() {

    document.getElementById("profileModal").style.display =
      "none";

  }


  // ==============================
  // Like
  // ==============================

  function likeCurrent() {

    if (!currentProfile) return;

    const target = currentProfile;

    const users = getUsers();

    const me = getMe();

    const myIndex =
      users.findIndex(u => u.id === me.id);

    const targetIndex =
      users.findIndex(u => u.id === target.id);

    if (myIndex === -1 || targetIndex === -1) return;


    // สร้าง likes ถ้ายังไม่มี
    if (!Array.isArray(users[myIndex].likes)) {
      users[myIndex].likes = [];
    }

    // เพิ่ม Like
    if (!users[myIndex].likes.includes(target.id)) {

      users[myIndex].likes.push(target.id);

    }


    // ตรวจว่าอีกฝ่าย Like เราหรือยัง
    const targetLikes =
      Array.isArray(users[targetIndex].likes)
        ? users[targetIndex].likes
        : [];


    const isMatch =
      targetLikes.includes(me.id);


    // ถ้า Match
    if (isMatch) {

      if (!Array.isArray(users[myIndex].matches)) {
        users[myIndex].matches = [];
      }

      if (!Array.isArray(users[targetIndex].matches)) {
        users[targetIndex].matches = [];
      }


      // เพิ่ม Match ให้ทั้งสองคน
      if (!users[myIndex].matches.includes(target.id)) {

        users[myIndex].matches.push(target.id);

      }

      if (!users[targetIndex].matches.includes(me.id)) {

        users[targetIndex].matches.push(me.id);

      }

      alert(
        `🎉 MATCH!\n\nคุณ Match กับ ${target.name} แล้ว ❤️`
      );

    }


    saveUsers(users, users[myIndex]);

    closeModal();

    currentProfile = null;

    showNextProfile();

    renderMatches();

  }


  // ==============================
  // Dislike
  // ==============================

  function dislikeCurrent() {

    if (!currentProfile) return;

    const users = getUsers();

    const me = getMe();

    const myIndex =
      users.findIndex(u => u.id === me.id);

    if (myIndex === -1) return;


    if (!Array.isArray(users[myIndex].disliked)) {

      users[myIndex].disliked = [];

    }


    if (
      !users[myIndex].disliked.includes(
        currentProfile.id
      )
    ) {

      users[myIndex].disliked.push(
        currentProfile.id
      );

    }


    saveUsers(users, users[myIndex]);

    currentProfile = null;

    showNextProfile();

  }


  // ==============================
  // แสดง Match
  // ==============================

  function renderMatches() {

    const me = getMe();

    if (!me) return;

    const users = getUsers();

    const matchIds =
      Array.isArray(me.matches)
        ? me.matches
        : [];

    const matchList =
      document.getElementById("matchList");


    if (matchIds.length === 0) {

      matchList.innerHTML = `
        <div style="
          color:#777;
          padding:15px 0;
        ">
          ยังไม่มี Match 💔
        </div>
      `;

      return;

    }


    matchList.innerHTML = "";


    matchIds.forEach(id => {

      const user =
        users.find(u => u.id === id);

      if (!user) return;


      const photo = user.photo
        ? `<img src="${user.photo}" alt="profile">`
        : `👤`;


      const div =
        document.createElement("div");

      div.className = "match-card";

      div.innerHTML = `

        <div class="match-photo">
          ${photo}
        </div>

        <div class="match-info">

          <div class="match-name">
            ${escapeHTML(user.name)}
          </div>

          <div class="match-detail">
            ${escapeHTML(user.faculty || "-")}
          </div>

        </div>

        <button
          class="chat-btn"
          onclick="openChat('${user.id}')"
        >
          💬 แชต
        </button>

      `;


      matchList.appendChild(div);

    });

  }


  // ==============================
  // ไปหน้า Chat
  // ==============================

  function openChat(id) {

    localStorage.setItem(
      "sutTinderSelectedChatId",
      id
    );

    window.location.href =
      "chat.html";

  }


  // ==============================
  // ปุ่มต่าง ๆ
  // ==============================

  function goProfile() {

    window.location.href =
      "profile.html";

  }


  function goChat() {

    window.location.href =
      "chat.html";

  }


  function logout() {

    localStorage.removeItem(
      "sutTinderLoggedIn"
    );

    localStorage.removeItem(
      "sutTinderUser"
    );

    localStorage.removeItem(
      "sutTinderMyProfile"
    );

    window.location.href =
      "login.html";

  }


  // ==============================
  // ป้องกัน HTML แปลก ๆ
  // ==============================

  function escapeHTML(text) {

    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  // ==============================
  // คลิกพื้นหลัง Modal เพื่อปิด
  // ==============================

  document
    .getElementById("profileModal")
    .addEventListener("click", function(e) {

      if (e.target === this) {
        closeModal();
      }

    });


  // ==============================
  // เริ่มทำงาน
  // ==============================

  init();

</script>

</body>
</html>
